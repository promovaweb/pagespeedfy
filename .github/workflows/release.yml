name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Preparar ou publicar release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      sha: ${{ steps.release.outputs.sha }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Executar Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publicar:
    name: Publicar pacote e artefatos
    if: needs.release-please.outputs.release_created == 'true'
    needs: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
      VERSAO: ${{ needs.release-please.outputs.version }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - name: Obter commit da release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.sha }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Instalar verificadores do ebook
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils poppler-utils unzip

      - name: Instalar dependências
        run: npm ci

      - name: Validar código, ebook e versão
        run: |
          npm run validar
          npm run ebook:verify
          npm run release:check -- "$TAG"

      - name: Empacotar e validar em isolamento
        run: |
          mkdir -p release-assets
          npm pack --pack-destination release-assets
          npm run package:verify -- "release-assets/promovaweb-pagespeedfy-${VERSAO}.tgz"

      - name: Reunir ebook e checksums
        run: |
          cp ebook/ebook-pagespeedfy.pdf "release-assets/Pagespeedfy-Guia-do-Usuario.pdf"
          cp ebook/ebook-pagespeedfy.epub "release-assets/Pagespeedfy-Guia-do-Usuario.epub"
          (cd release-assets && sha256sum * > SHA256SUMS.txt)

      - name: Anexar arquivos à GitHub Release
        run: gh release upload "$TAG" release-assets/* --clobber

      - name: Publicar pacote no npm
        env:
          GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm run publish:npm -- "release-assets/promovaweb-pagespeedfy-${VERSAO}.tgz"
