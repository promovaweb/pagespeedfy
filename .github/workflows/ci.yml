name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validar:
    name: Validar com Bun
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v5

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Validar projeto
        run: bun run validate

      - name: Instalar ferramentas do ebook
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils poppler-utils unzip

      - name: Conferir ebook
        run: bun run ebook:verify
