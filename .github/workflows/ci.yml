name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validar:
    name: Validar Node.js
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar projeto
        run: npm run validar

      - name: Instalar ferramentas do ebook
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils poppler-utils unzip

      - name: Conferir ebook
        run: npm run ebook:verify
